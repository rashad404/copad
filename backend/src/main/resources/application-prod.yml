spring:
  # Flyway settings come from application.yml. This profile used to disable it
  # because a V5 migration failed here on 2025-06-15 and Flyway refuses to run
  # with a failed migration recorded; the history has since been reset and the
  # schema baselined at V7, so it can own migrations again.
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      # Flyway owns the schema; ddl-auto must not silently alter production.
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.MariaDBDialect
    properties:
      hibernate:
        connection:
          characterEncoding: UTF-8
          useUnicode: true
          charSet: UTF-8
        format_sql: false
        dialect: org.hibernate.dialect.MariaDBDialect
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope: public_profile,email
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"

# Production environment settings
app:
  chatgpt:
    use-dummy-data: false
    base-url: https://virtualhekim.az
    openai:
      key: ${OPENAI_API_KEY}
      model: o3
      url: https://api.openai.com/v1/chat/completions

# Upload settings for production
upload:
  base-dir: /home/copad/public_html
  public-url: https://virtualhekim.az

# Logging for production
logging:
  level:
    root: INFO
    org.springframework.security: INFO
    com.drcopad.copad: INFO
    org.hibernate.SQL: WARN
    
# Server configuration
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    remoteip:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For
      internal-proxies: .*
  use-forward-headers: true