spring:
  flyway:
    enabled: true
    baseline-on-migrate: true
    # Existing schemas were built by ddl-auto, not by V3-V7, so treat anything
    # already deployed as being at V7 and only apply V8 onward.
    baseline-version: 7
    baseline-description: "Schema as built by hibernate ddl-auto"
    locations: classpath:db/migration
    validate-on-migrate: true
  mvc:
    throw-exception-if-no-handler-found: true  # Needed to catch 404s manually
  devtools:
    restart:
      enabled: true
      quiet-period: 2000
      poll-interval: 3000
    livereload:
      enabled: true
  profiles:
    active: local  # change to 'prod' when deploying to production
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid,profile,email
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
          facebook:
            client-id: ${FACEBOOK_CLIENT_ID}
            client-secret: ${FACEBOOK_CLIENT_SECRET}
            scope: public_profile,email
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"

  # Sending is off unless a host is configured, so a developer machine never
  # tries to post real mail. Production sets MAIL_HOST.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  datasource:
    url: ${DATABASE_URL}?useUnicode=true&characterEncoding=UTF-8&characterSetResults=UTF-8
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      # Flyway owns the schema outright. Not "validate": Hibernate compares
      # columnDefinition strings literally, so MySQL charset/collation on text
      # columns fails validation even when the schema is correct.
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        connection:
          characterEncoding: UTF-8
          useUnicode: true
          charSet: UTF-8
  servlet:
      multipart:
        max-file-size: 25MB
        max-request-size: 26MB
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    # Read and discard an oversized upload rather than cutting the connection.
    #
    # When Tomcat rejects a body it stops reading, and the proxy in front sees a
    # broken upstream and answers 502 with an HTML error page - so the readable
    # 413 the application generated never reaches anyone. Swallowing a little
    # more than the limit lets the real response be delivered. A genuinely huge
    # upload is still cut off, which is the point.
    max-swallow-size: 30MB
    remoteip:
      protocol-header: X-Forwarded-Proto
      remote-ip-header: X-Forwarded-For
      internal-proxies: .*
  use-forward-headers: true
  error:
    path: /custom-error   # Default is /error
    whitelabel:
      enabled: true # If true, uses default Spring Boot error page

app:
  # Appointment notifications. Off unless switched on, so a developer machine
  # and the test profile never post real mail.
  notifications:
    enabled: ${NOTIFICATIONS_ENABLED:false}
    from: ${NOTIFICATIONS_FROM:info@azdoc.ai}
    interval-ms: ${NOTIFICATIONS_INTERVAL_MS:60000}
  chatgpt:
    use-dummy-data: false
    base-url: ${BASE_URL:http://localhost:8080}
    openai:
      key: ${OPENAI_API_KEY}
      # model: gpt-3.5-turbo
      model: o3
      url: https://api.openai.com/v1/chat/completions
      responses:
        enabled: ${OPENAI_RESPONSES_ENABLED:true}
        url: https://api.openai.com/v1/responses
        fallback-to-chat: ${OPENAI_RESPONSES_FALLBACK:false}
        default-model: o3
        conversation-ttl-days: 30
        tools:
          file-search: true
          web-search: false
          code-interpreter: true
        cost:
          alert-threshold: 10.00
          daily-limit: 50.00
        retry:
          max-attempts: 3
          initial-interval: 1000
          max-interval: 10000
          multiplier: 2.0

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{requestId:-no-request}] %-40.40logger{39} : %m%n"
  level:
    org.springframework.security: DEBUG


ai:
  spend:
    # A ceiling on the bill, not on any one caller. The per-user and
    # per-session limits cannot bound the total, because a session costs
    # nothing to mint and each new one starts with a fresh allowance.
    daily-limit-usd: ${AI_DAILY_LIMIT_USD:25.00}
    # Set false to watch the meter without ever refusing a request.
    enforce: ${AI_SPEND_ENFORCE:true}

ocr:
  # Reads text off a photographed or scanned report, which has no text layer.
  # It transcribes only; the existing parsers turn that text into values, so the
  # rules worked out against real Azerbaijani reports still apply.
  enabled: ${OCR_ENABLED:true}
  # Transcription does not need the reasoning model.
  model: ${OCR_MODEL:gpt-4o}

attachment:
  storage:
    # Outside the web root. Files here are served only by
    # /api/attachments, which checks the owning session.
    root: ${ATTACHMENT_STORAGE_ROOT:${user.home}/azdoc-attachments}

upload:
  base-dir: ${UPLOAD_BASE_DIR:../public_html}
  public-url: ${PUBLIC_URL:http://localhost:8080}
  max-batch-size: 10
  allowed-medical-formats:
    images: jpg,jpeg,png,webp,dicom
    documents: pdf,doc,docx,txt,csv
    max-file-size-mb:
      images: 50
      documents: 10

resilience4j:
  circuitbreaker:
    instances:
      openai-responses:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 60s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      openai-responses:
        maxAttempts: 3
        waitDuration: 1000
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
        ignoreExceptions:
          - java.lang.IllegalArgumentException
  ratelimiter:
    instances:
      openai-responses:
        limitForPeriod: 100
        limitRefreshPeriod: 1m
        timeoutDuration: 0

management:
  # Actuator listens on its own port bound to loopback. metrics and prometheus
  # describe the internals of a system holding medical data and have no
  # business being reachable from the internet; /api/health is the public
  # liveness check instead.
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true

medicine:
  sync:
    # Direct read of the bugun.az catalogue. Empty where there is no access,
    # which disables the sync rather than failing at startup.
    url: ${MEDICINE_SYNC_URL:}
    username: ${MEDICINE_SYNC_USERNAME:}
    password: ${MEDICINE_SYNC_PASSWORD:}

retention:
  # Nothing expired before this existed. Anonymous conversations accumulated
  # from the first day the product ran, because no one decided otherwise -
  # which is a decision by default, and the wrong one for medical content.
  enabled: ${RETENTION_ENABLED:true}
  # Long enough that someone returning after a season still finds their
  # history, short enough that a health question asked once does not sit here
  # for years. Judged on last activity, never on when it was created.
  guest-session-days: ${RETENTION_GUEST_SESSION_DAYS:90}
  # Nightly, away from the backup window.
  cron: ${RETENTION_CRON:0 30 4 * * *}

document:
  encryption:
    # Patient files are encrypted before they reach the disk.
    #
    # This protects a leaked backup, another account on this shared host, and a
    # disk that leaves the building. It does not protect against someone who is
    # already root on the running server, because the key is in this process's
    # environment - claiming otherwise would justify decisions it does not
    # support.
    enabled: ${DOCUMENT_ENCRYPTION_ENABLED:true}
    # Base64, 32 bytes. Never in the repository. The application refuses to
    # start without it rather than quietly writing plaintext.
    key: ${DOCUMENT_ENCRYPTION_KEY:}
  storage:
    # Outside the web root. Patient files are served only through an endpoint
    # that checks family access, never by the web server directly.
    root: ${DOCUMENT_STORAGE_ROOT:${user.home}/azdoc-documents}
